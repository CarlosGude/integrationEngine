integration_engine:
    integrations: {}
    # One entry per external API, e.g.:
    # my_api:
    #     base_url: 'https://api.example.com'
    #     config_path: '%kernel.project_dir%/src/Integration/MyApi/MyApi.yaml'
    #     cache_service: ~          # optional, default: cache.app
    #     client_service: ~         # optional, fully custom HTTP client
    #     connection_resolver: ~    # optional, multi-tenant integrations

services:
    # Manual/local lifecycle dispatcher. Bundle-managed engines dispatch
    # RequestSent/ResponseMapped/RequestFailed/etc. through Symfony's
    # event_dispatcher directly; share this adapter explicitly only when
    # using LifecycleEventDispatcher::subscribe() in manual wiring.
    IntegrationEngine\Core\Lifecycle\LifecycleEventDispatcher:
        class: IntegrationEngine\Infrastructure\Lifecycle\SymfonyEventDispatcherAdapter
        arguments:
            - '@event_dispatcher'
