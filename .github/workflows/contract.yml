name: Contract Test (Bundle → Demo)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  demo-contract:
    name: Demo app still works with this bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bundle
        uses: actions/checkout@v4
        with:
          path: bundle

      - name: Checkout demo app
        uses: actions/checkout@v4
        with:
          repository: CarlosGude/integrationEngine-demo
          path: demo
          ref: main

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, zip
          coverage: pcov # The demo's make test requests coverage.

      # Fetch tags to ensure Composer can resolve the correct version
      - name: Fetch git tags
        run: cd bundle && git fetch --tags

      # The demo requires "dev-main", so the path repo has to offer exactly that
      # version: a path repo is canonical, and anything it does not match makes
      # the package uninstallable rather than falling through to the VCS repo.
      # (It used to declare 6.0.99, which worked only while the demo asked for
      # "@dev" — an implicit "*" that any version satisfies.)
      - name: Install the demo against this bundle checkout
        working-directory: demo
        run: |
          composer config repositories.bundle '{"type": "path", "url": "../bundle", "options": {"symlink": false, "versions": {"carlosgude/integration-engine": "dev-main"}}}'
          composer update --no-interaction --prefer-dist # NOSONAR: the demo has no lock file; this resolves it against this checkout on purpose
          composer show carlosgude/integration-engine | grep -E '^(versions|source|dist)'

      - name: Run demo tests
        working-directory: demo
        run: make test

      - name: Run demo static analysis
        working-directory: demo
        run: make stan
