name: Contract Test (Bundle → Demo)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  demo-contract:
    name: Demo app still works with this bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bundle
        uses: actions/checkout@v4
        with:
          path: bundle

      - name: Checkout demo app
        uses: actions/checkout@v4
        with:
          repository: CarlosGude/integrationEngine-demo
          path: demo
          ref: main

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, zip
          coverage: pcov # The demo's make test requests coverage.

      # Fetch tags so the path repository can expose this checkout as the
      # latest released 8.x version required by the demo.
      - name: Fetch git tags
        run: cd bundle && git fetch --tags

      # The demo requires a released 8.x version (currently ^8.0.4). A path
      # repository is canonical, so advertising the checkout as dev-main makes
      # Composer reject it. Use the highest v8.* tag as the synthetic package
      # version; reading tag refs directly also works with the shallow clone.
      - name: Install the demo against this bundle checkout
        working-directory: demo
        run: |
          BUNDLE_VERSION="$(git -C ../bundle tag --list 'v8.*' --sort=-v:refname | head -n1 | sed 's/^v//')"
          composer config repositories.bundle '{"type":"path","url":"../bundle","options":{"symlink":false,"versions":{"carlosgude/integration-engine":"'"${BUNDLE_VERSION}"'"}}}'
          composer update --no-interaction --prefer-dist # NOSONAR: the demo has no lock file; this resolves it against this checkout on purpose
          composer show carlosgude/integration-engine | grep -E '^(versions|source|dist)'

      - name: Run demo tests
        working-directory: demo
        run: make test

      - name: Run demo static analysis
        working-directory: demo
        run: make stan
