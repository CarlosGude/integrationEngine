name: Contract Test (Bundle → Demo)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  demo-contract:
    name: Demo app still works with this bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bundle
        uses: actions/checkout@v4
        with:
          path: bundle

      - name: Checkout demo app
        uses: actions/checkout@v4
        with:
          repository: CarlosGude/integrationEngine-demo
          path: demo
          ref: main

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, zip
          coverage: none

      # Fetch tags to ensure Composer can resolve the correct version
      - name: Fetch git tags
        run: cd bundle && git fetch --tags

      # A high version keeps the demo's own constraint (^6.0+) satisfied by
      # this checkout, so the demo's composer.json doesn't need to change.
      - name: Install the demo against this bundle checkout
        working-directory: demo
        run: |
          composer config repositories.bundle '{"type": "path", "url": "../bundle", "options": {"symlink": false, "versions": {"carlosgude/integration-engine": "7.0.1"}}}'
          composer update --no-interaction --prefer-dist # NOSONAR: the demo has no lock file; this resolves it against this checkout on purpose
          composer show carlosgude/integration-engine | grep -E '^(versions|source|dist)'

      - name: Run demo tests
        working-directory: demo
        run: make test

      - name: Run demo static analysis
        working-directory: demo
        run: make stan
