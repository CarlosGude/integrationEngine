deptrac:
  paths: [./src, ./tests]
  layers:
    - name: Core
      collectors: [{ type: directory, value: src/Core/.* }]
    - name: Infrastructure
      collectors: [{ type: directory, value: src/Infrastructure/.* }]
    - name: Bundle
      collectors: [{ type: directory, value: src/Bundle/.* }]
    - name: Utils
      collectors: [{ type: directory, value: src/Utils/.* }]
    - name: Compatibility
      collectors: [{ type: directory, value: src/Compatibility/.* }]
    - name: Tests
      collectors: [{ type: directory, value: tests/.* }]
    - name: Psr
      collectors: [{ type: classNameRegex, value: '#^Psr\\#' }]
    - name: Symfony
      collectors: [{ type: classNameRegex, value: '#^Symfony\\#' }]
    - name: Extension
      collectors: [{ type: directory, value: src/PHPStan/.* }]
    - name: PHPStan
      collectors: [{ type: classNameRegex, value: '#^PHPStan\\#' }]
    - name: PhpParser
      collectors: [{ type: classNameRegex, value: '#^PhpParser\\#' }]
    - name: PHPUnit
      collectors: [{ type: classNameRegex, value: '#^PHPUnit\\#' }]
  ruleset:
    Core: [Psr]
    Infrastructure: [Core, Psr, Symfony]
    Bundle: [Core, Infrastructure, Psr, Symfony]
    Compatibility: [Core, Infrastructure]
    Utils: []
    Extension: [Core, PHPStan, PhpParser]
    Tests: [Extension, PHPStan, PhpParser, Compatibility, Core, Infrastructure, Bundle, Utils, Psr, Symfony, PHPUnit]
